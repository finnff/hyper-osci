; HYPEROSCI slave firmware — ESP32-C3 SuperMini
; Uses the pioarduino platform (Arduino core 3.x on ESP-IDF 5.x); the stock
; platformio espressif32 platform is frozen at core 2.x/IDF 4.4 and lacks the
; i2s_std / adc_continuous drivers this firmware needs.

[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
; Single 3 MB app slot — no OTA planned (default.csv's dual-OTA layout capped
; the app at 1280 KB and put the build at 77% flash for no benefit).
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
